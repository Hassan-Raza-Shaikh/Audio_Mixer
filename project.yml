name: AudioMixer
options:
  bundleIdPrefix: com.hassan
targets:
  AudioMixer:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_NAME: "Aura"
        PRODUCT_BUNDLE_IDENTIFIER: com.hassan.Aura
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Debug builds otherwise split code into Aura.debug.dylib, which hardened
        # runtime's library validation rejects when signed without a Team ID
        # (the self-signed local identity).
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: 6.0
        CODE_SIGN_ENTITLEMENTS: Resources/AudioMixer.entitlements
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          # No get-task-allow (debugger attach) in distribution builds.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
